name: OSXMB
options:
  bundleIdPrefix: com.jonas
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_HARDENED_RUNTIME: NO
targets:
  OSXMB:
    type: application
    platform: macOS
    sources:
      - path: OSXMB
    info:
      path: OSXMB/Info.plist
      properties:
        CFBundleName: OSXMB
        CFBundleDisplayName: OSXMB
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "OSXMB. PS3-inspired XMB live wallpaper. Not affiliated with Sony. Rendering code adapted from the MIT-licensed PlayStation-3-XMB project by Mart (linkev)."
        LSMinimumSystemVersion: "14.0"
        NSSupportsAutomaticGraphicsSwitching: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonas.osxmb
        PRODUCT_NAME: OSXMB
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: SwiftUI.framework
      - sdk: AVFoundation.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: ServiceManagement.framework
